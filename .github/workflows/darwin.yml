name: OpenPHIGS build CI on Darwin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
          contents: read

jobs:
  build:

    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        asan: [ON, OFF]

    steps:
    - uses: actions/checkout@v4

    - name: dependencies
      run: brew reinstall gcc; brew install --cask xquartz; brew install mesa-glu glfw3 tcsh glew openmotif libXaw gl2ps

    - name: clean
      run: make clean

    - name: configure
      run: make config OPENPHIGS_OPTS="-DUSE_ASAN=${{ matrix.asan }}"

    - name: Build
      run: make build

    - name: Install test
      run: make install
